version: '3'

vars:
  PROTO_DIR: ./api/proto
  GEN_DIR: .
tasks:
  proto:
    desc: Generate Go code from proto files
    cmds:
      - |
        protoc \
        -I={{.PROTO_DIR}} \
        --go_out={{.GEN_DIR}} \
        --go_opt=paths=source_relative \
        --go-grpc_out={{.GEN_DIR}} \
        --go-grpc_opt=paths=source_relative \
        {{.PROTO_DIR}}/game/game.proto
