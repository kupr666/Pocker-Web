version: '3'

vars:
  PROTO_DIR: api/proto #Исходники
  GEN_DIR: gen/go #Каталог для сгенирированного кода
  GO_PACKAGE_PREFIX: github.com/kupr666/Pocker-Web/gen/go #Префикс для пакетов

tasks:
  proto:tools:
    desc: Install Go generators
    cmds:
      - go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
      - go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2

  proto:
    desc: Generate Go code from proto files
    dir: '{{.ROOT_DIR}}' #Директория корневого таскфайла.Относительные пути будут отсчитываться от него
    cmds:
      - mkdir -p "{{.GEN_DIR}}"
      - |
        find "{{.PROTO_DIR}}" -type f -name '*.proto' \
          -exec protoc \
            --proto_path="{{.PROTO_DIR}}" \
            --go_out="{{.GEN_DIR}}" \
            --go_opt=module={{.GO_PACKAGE_PREFIX}} \
            --go-grpc_out="{{.GEN_DIR}}" \
            --go-grpc_opt=module={{.GO_PACKAGE_PREFIX}} \
            {} +