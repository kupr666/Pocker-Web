syntax = "proto3";

package game.v1;

option go_package = "github.com/kupr666/Pocker-Web/gen/go/game/v1;gamev1";

service GameService {
    rpc GetTable(GetTableRequest) returns (GetTableResponse);
    rpc ApplyAction(ApplyActionRequest) returns (ApplyActionResponse);
    rpc SubscribeTable(SubscribeTableRequest) returns (stream TableSnapshot);
}

message GetTableRequest {
    string table_id = 1;
    string player_id = 2;
}

message GetTableResponse {
    TableSnapshot table = 1;
}

message ApplyActionRequest {
    string table_id = 1;
    string player_id = 2;
    string request_id = 3;
    ActionType action = 4;
    int64 raise_to = 5;
}

enum ActionType {
  ACTION_TYPE_UNSPECIFIED = 0;
  ACTION_TYPE_FOLD = 1;
  ACTION_TYPE_CHECK = 2;
  ACTION_TYPE_CALL = 3;
  ACTION_TYPE_RAISE = 4;
  ACTION_TYPE_ALL_IN = 5;
}

message ApplyActionResponse {
    TableSnapshot table = 1;
}

message SubscribeTableRequest {
    string table_id = 1;
    string player_id = 2;
}

message TableSnapshot {
  string table_id = 1;
  uint64 version = 2;

  repeated Player players = 3;
  repeated Card community_cards = 4;
  repeated Card your_cards = 5;

  int64 pot = 6;
  string acting_player_id = 7;
  Stage stage = 8;
}

message Player {
  string id = 1;
  string name = 2;
  uint32 seat = 3;

  int64 stack = 4;
  int64 street_bet = 5;

  bool folded = 6;
  bool all_in = 7;
}

message Card {
  uint32 rank = 1; // 2–14, туз = 14.
  Suit suit = 2;
}

enum Suit {
  SUIT_UNSPECIFIED = 0;
  SUIT_CLUBS = 1;
  SUIT_DIAMONDS = 2;
  SUIT_HEARTS = 3;
  SUIT_SPADES = 4;
}

enum Stage {
  STAGE_UNSPECIFIED = 0;
  STAGE_WAITING = 1;
  STAGE_PREFLOP = 2;
  STAGE_FLOP = 3;
  STAGE_TURN = 4;
  STAGE_RIVER = 5;
  STAGE_SHOWDOWN = 6;
  STAGE_FINISHED = 7;
}